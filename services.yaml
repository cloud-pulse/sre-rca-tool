# SRE-AI Service Dependency Map
# ─────────────────────────────────────────
# Define YOUR services here.
# The tool reads this file at runtime —
# no service names are hardcoded in the code.
#
# To add a new service:
#   1. Add an entry under "services:"
#   2. Fill in depends_on and exposes_to
#   3. The tool will auto-discover more
#      dependencies from logs and ask you
#      before adding them here.
#
# dependency_confidence levels:
#   user_defined      — you added this manually
#   discovered_high   — found in connection logs
#   discovered_medium — found in error logs
# This file is used by the RCA engine to:
#   - understand service dependencies
#   - correlate failures
#   - analyze cascading impact
#   - map observability data
services:

  frontend:
    description: "User-facing frontend service"
    namespace: default
    port: 80
    depends_on:
      - productcatalogservice
      - recommendationservice
      - cartservice
      - shippingservice
      - checkoutservice
      - currencyservice
      - adservice
    exposes_to: []
    health_endpoint: /
    containers:
      - name: server
    dependency_confidence: user_defined

  checkoutservice:
    description: "Handles checkout workflow orchestration"
    namespace: default
    port: 5050
    depends_on:
      - paymentservice
      - shippingservice
      - emailservice
      - currencyservice
      - cartservice
      - productcatalogservice
    exposes_to:
      - frontend
    health_endpoint: /health
    containers:
      - name: server
    dependency_confidence: user_defined

  recommendationservice:
    description: "Provides product recommendations"
    namespace: default
    port: 8080
    depends_on:
      - productcatalogservice
    exposes_to:
      - frontend
    health_endpoint: /health
    containers:
      - name: server
    dependency_confidence: user_defined

  productcatalogservice:
    description: "Provides product catalog information"
    namespace: default
    port: 3550
    depends_on: []
    exposes_to:
      - frontend
      - checkoutservice
      - recommendationservice
    health_endpoint: /health
    containers:
      - name: server
    dependency_confidence: user_defined

  cartservice:
    description: "Handles shopping cart operations"
    namespace: default
    port: 7070
    depends_on:
      - redis-cart
    exposes_to:
      - frontend
      - checkoutservice
    health_endpoint: /health
    containers:
      - name: server
    dependency_confidence: user_defined

  redis-cart:
    description: "Redis backend for cart persistence"
    namespace: default
    port: 6379
    depends_on: []
    exposes_to:
      - cartservice
    health_endpoint: /ping
    containers:
      - name: redis
    dependency_confidence: user_defined

  paymentservice:
    description: "Processes payment transactions"
    namespace: default
    port: 50051
    depends_on: []
    exposes_to:
      - checkoutservice
    health_endpoint: /health
    containers:
      - name: server
    dependency_confidence: user_defined

  shippingservice:
    description: "Calculates shipping costs and delivery"
    namespace: default
    port: 50051
    depends_on: []
    exposes_to:
      - frontend
      - checkoutservice
    health_endpoint: /health
    containers:
      - name: server
    dependency_confidence: user_defined

  currencyservice:
    description: "Currency conversion service"
    namespace: default
    port: 7000
    depends_on: []
    exposes_to:
      - frontend
      - checkoutservice
      - paymentservice
    health_endpoint: /health
    containers:
      - name: server
    dependency_confidence: user_defined

  emailservice:
    description: "Sends order confirmation emails"
    namespace: default
    port: 5000
    depends_on: []
    exposes_to:
      - checkoutservice
    health_endpoint: /health
    containers:
      - name: server
    dependency_confidence: user_defined

  adservice:
    description: "Provides advertisement recommendations"
    namespace: default
    port: 9555
    depends_on: []
    exposes_to:
      - frontend
    health_endpoint: /health
    containers:
      - name: server
    dependency_confidence: user_defined

  loadgenerator:
    description: "Generates synthetic traffic for testing"
    namespace: default
    port: 8089
    depends_on:
      - frontend
    exposes_to: []
    health_endpoint: /
    containers:
      - name: main
    dependency_confidence: user_defined